# Único punto de entrada de la aplicación.
# Se monta como /etc/nginx/conf.d/default.conf en el servicio nginx.

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # API y health check van al backend.
    location /api/ {
        proxy_pass http://padron-backend:5000;
    }

    location = /health {
        proxy_pass http://padron-backend:5000/health;
    }

    # Todo lo demás lo sirve el frontend estático.
    location / {
        proxy_pass http://padron-frontend:80;
    }
}
