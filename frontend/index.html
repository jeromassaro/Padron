<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padrón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">
    <header class="encabezado">
      <h1>Usuarios</h1>
      <p id="conteo" class="conteo" aria-live="polite"></p>
    </header>

    <div class="barra">
      <label class="buscador">
        <span class="sr-only">Buscar por nombre</span>
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.5"></circle>
          <path d="M13.5 13.5 17 17"></path>
        </svg>
        <input type="search" id="buscador" placeholder="Buscar por nombre" autocomplete="off">
      </label>
      <button type="button" class="btn btn-primario" id="btn-nuevo">Nuevo usuario</button>
    </div>

    <section class="panel" aria-live="polite">
      <ul id="lista" class="lista"></ul>
      <div id="mensaje" class="mensaje" hidden></div>
    </section>
  </main>

  <!-- Alta y edición -->
  <dialog id="dlg-form" aria-labelledby="titulo-form">
    <form id="form" class="dlg-contenido" novalidate>
      <h2 id="titulo-form">Nuevo usuario</h2>

      <div class="campo">
        <label for="in-nombre">Nombre</label>
        <input type="text" id="in-nombre" name="nombre" maxlength="100" required autocomplete="off" aria-describedby="err-nombre">
        <p class="error" id="err-nombre"></p>
      </div>

      <div class="campo">
        <label for="in-email">Email</label>
        <input type="email" id="in-email" name="email" maxlength="120" required autocomplete="off" aria-describedby="err-email">
        <p class="error" id="err-email"></p>
      </div>

      <div class="campo">
        <label for="in-rol">Rol</label>
        <select id="in-rol" name="rol">
          <option value="Administrador">Administrador</option>
          <option value="Editor">Editor</option>
          <option value="Lector" selected>Lector</option>
        </select>
      </div>

      <p class="error error-general" id="err-general" role="alert"></p>

      <div class="acciones-dlg">
        <button type="button" class="btn btn-secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primario" id="btn-guardar">Guardar usuario</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmación de baja -->
  <dialog id="dlg-eliminar" aria-labelledby="titulo-eliminar">
    <div class="dlg-contenido">
      <h2 id="titulo-eliminar">Eliminar usuario</h2>
      <p id="texto-eliminar" class="texto-dlg"></p>
      <p class="error error-general" id="err-eliminar" role="alert"></p>
      <div class="acciones-dlg">
        <button type="button" class="btn btn-secundario" data-cerrar>Cancelar</button>
        <button type="button" class="btn btn-peligro" id="btn-confirmar-eliminar">Eliminar usuario</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
