services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      padron-frontend:
        condition: service_healthy
      padron-backend:
        condition: service_healthy
    networks:
      - padron-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  padron-backend:
    build: ./backend
    environment:
      PORT: "5000"
      FLASK_DEBUG: "0"
      # Queda preparada para la próxima etapa, cuando el backend use la base.
      DATABASE_URL: postgresql://${POSTGRES_USER:-padron}:${POSTGRES_PASSWORD:-padron}@postgres:5432/${POSTGRES_DB:-padron}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - padron-net
    restart: unless-stopped

  padron-frontend:
    build: ./frontend
    networks:
      - padron-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-padron}
      POSTGRES_USER: ${POSTGRES_USER:-padron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padron}
    volumes:
      - padron-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - padron-net
    restart: unless-stopped

volumes:
  padron-data:

networks:
  padron-net:
    driver: bridge
